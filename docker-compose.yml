# 服务端部署编排：直接拉取 Docker Hub 镜像（含主控端静态页）。
# 如需从源码构建镜像，使用：docker build -t yunshenwuji/scriptcue-server:latest .
services:
  scriptcue-server:
    image: yunshenwuji/scriptcue-server:latest
    ports:
      - "8000:8000"
    volumes:
      - scriptcue-data:/app/data
    restart: unless-stopped

volumes:
  scriptcue-data:
