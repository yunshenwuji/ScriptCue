# 服务端部署编排：直接拉取 Docker Hub 镜像（含主控端静态页）。
# 审计日志以绑定挂载方式存放在本文件旁的 ./data 目录。
# 首次部署前请先准备权限（容器以固定 UID 10001 运行，见 Dockerfile）：
#   mkdir -p data && sudo chown -R 10001:10001 data
# 如需从源码构建镜像，使用：docker build -t yunshenwuji/scriptcue-server:latest .
services:
  scriptcue-server:
    image: yunshenwuji/scriptcue-server:latest
    ports:
      # 宿主机 13658 → 容器 8000；主控端浏览器与被控端连接地址均需使用 :13658
      - "13658:8000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
