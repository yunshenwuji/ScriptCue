# 发版打包流水线：
# - 推送 v* 标签 → 三平台打包并创建 GitHub Release（附产物与 update-manifest.json）
# - 手动触发（workflow_dispatch）→ 仅执行打包，产物在 Actions 运行页下载（用于验证打包）
# 清单与产物的 CDN 同步在 tag 发布时自动完成（release job 末步，scripts/sync_to_123pan.py；
# PAN123_CLIENT_ID/PAN123_CLIENT_SECRET 未配置时跳过）；细节与手动兜底见 docs/auto-update.md。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Windows x64 单文件（PyInstaller onefile，运行于 x64 runner，产物仅支持 64 位 Windows）
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: pip install -r agent/requirements.txt pyinstaller

      # tag 触发时把版本号注入 agent/agent/version.py（单文件，覆盖 dev 占位）；
      # 手动触发时保持 0.0.0.dev，产物不会被自动更新通道当作正式版本。
      - name: 写入版本号（tag 触发时）
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
            # BSD/GNU 通用写法（macOS runner 的 sed 为 BSD 系，-i 必须带后缀参数）
            sed -i.bak 's/^APP_VERSION = .*/APP_VERSION = "'"$ver"'"/' agent/agent/version.py \
              && rm -f agent/agent/version.py.bak
            grep -q "APP_VERSION = \"$ver\"" agent/agent/version.py \
              || { echo "::error::版本号写入失败"; exit 1; }
            echo "版本号已写入: $ver"
          else
            echo "非 tag 触发，保持 dev 版本"
          fi

      - name: 打包 Windows x64
        working-directory: agent
        run: .\build_windows.ps1

      - name: 重命名产物（标注平台与架构）
        run: Move-Item agent\dist\ScriptCueAgent.exe ScriptCueAgent-windows-x64.exe

      - uses: actions/upload-artifact@v7
        with:
          name: ScriptCueAgent-windows-x64
          path: ScriptCueAgent-windows-x64.exe

  # macOS 双架构：Apple Silicon（arm64）与 Intel（x86_64）各打一包，
  # PyInstaller 不支持跨架构构建，必须分别在对应架构 runner 上打包
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Apple Silicon
            arch: arm64
          - runner: macos-15-intel    # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: pip install -r agent/requirements.txt pyinstaller

      # tag 触发时把版本号注入 agent/agent/version.py（见 build-windows 同步骤说明）
      - name: 写入版本号（tag 触发时）
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
            # BSD/GNU 通用写法（macOS runner 的 sed 为 BSD 系，-i 必须带后缀参数）
            sed -i.bak 's/^APP_VERSION = .*/APP_VERSION = "'"$ver"'"/' agent/agent/version.py \
              && rm -f agent/agent/version.py.bak
            grep -q "APP_VERSION = \"$ver\"" agent/agent/version.py \
              || { echo "::error::版本号写入失败"; exit 1; }
            echo "版本号已写入: $ver"
          else
            echo "非 tag 触发，保持 dev 版本"
          fi

      # 自签代码签名证书导入（可选）：未配置 Secrets 时跳过，产物保留 ad-hoc 签名。
      # 稳定签名身份使 TCC"辅助功能"授权跨版本保留（详见 agent/build_macos.sh 签名段）。
      # 需配置 Secrets：MACOS_SIGNING_P12_B64（p12 证书的 base64）、
      #   MACOS_SIGNING_PASSWORD（p12 导出密码）、MACOS_SIGNING_IDENTITY（证书名称）。
      # keychain 密码为 runner 临时钥匙串专用，仅存活于本次构建，无需保密。
      - name: 导入自签签名证书
        env:
          MACOS_SIGNING_P12_B64: ${{ secrets.MACOS_SIGNING_P12_B64 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          if [ -z "$MACOS_SIGNING_P12_B64" ]; then
            echo "未配置 MACOS_SIGNING_P12_B64，跳过证书导入（产物保留 ad-hoc 签名）"
            exit 0
          fi
          python3 -c "import base64, os; open(os.environ['RUNNER_TEMP'] + '/signing.p12', 'wb').write(base64.b64decode(os.environ['MACOS_SIGNING_P12_B64']))"
          security create-keychain -p "scriptcue-runner" "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain"
          # 已知良性现象（macOS 15/26 runner）：import 过程打印
          # "SecKeychainItemSetExtendedAttribute" 警告，且即使已成功导入
          # （"1 identity imported."）也可能返回非零退出码。故不以 import
          # 退出码为准，改用 find-identity 做权威校验——真实失败（密码错、
          # p12 损坏）会被校验捕获并以明确错误终止。
          security import "$RUNNER_TEMP/signing.p12" -P "$MACOS_SIGNING_PASSWORD" \
            -a -t agg -k "$RUNNER_TEMP/build.keychain" -T /usr/bin/codesign \
            || echo "::warning::security import 返回非零退出码（若上方已打印 'identity imported'，属已知良性现象）"
          identities=$(security find-identity "$RUNNER_TEMP/build.keychain") || true
          echo "$identities"
          echo "$identities" | grep -qF "$MACOS_SIGNING_IDENTITY" \
            || { echo "::error::证书导入校验失败：未找到身份「$MACOS_SIGNING_IDENTITY」，请核对 p12/密码/身份名三个 Secrets"; exit 1; }
          security list-keychain -d user -s "$RUNNER_TEMP/build.keychain" login.keychain-db
          # 部分 runner 镜像上此命令会因系统限制返回非零；import 的 -T 已授权
          # codesign 访问私钥，若真失败会在打包步骤的 codesign 报错中体现
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "scriptcue-runner" "$RUNNER_TEMP/build.keychain" \
            || echo "::warning::set-key-partition-list 返回非零退出码，若后续 codesign 报私钥访问错误需回查此步"

      - name: 打包 macOS ${{ matrix.arch }}（.app + 拖拽安装 .dmg）
        working-directory: agent
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: bash build_macos.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ScriptCueAgent-macos-${{ matrix.arch }}
          path: |
            agent/dist/ScriptCueAgent-macos-${{ matrix.arch }}.dmg
            agent/dist/ScriptCueAgent-macos-${{ matrix.arch }}-update.tar.gz

  # 汇总创建 Release（仅 tag 触发；手动运行只产出上方 artifacts）
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: 汇集打包产物
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # 对产物逐个做 sha256 并写入更新清单；清单只发布稳定名 update-manifest.json
      # 一份（某版本的历史清单可从对应 Release 附件取）。
      # 清单只含文件名、不含 CDN 绝对地址：下发时由服务端注入 url（见
      # server/server/updatefeed.py 与 docs/auto-update.md）。
      - name: 生成校验和与更新清单
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, subprocess

          dist = pathlib.Path("dist")
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag[1:] if tag.startswith("v") else tag

          # 平台键 → (产物名, kind, 是否 macOS 自签身份)
          spec = {
              "windows-x64": ("ScriptCueAgent-windows-x64.exe", "exe", False),
              "macos-arm64": ("ScriptCueAgent-macos-arm64-update.tar.gz", "tar.gz", True),
              "macos-x86_64": ("ScriptCueAgent-macos-x86_64-update.tar.gz", "tar.gz", True),
          }

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          authority = os.environ.get("MACOS_SIGNING_IDENTITY", "").strip()
          assets = {}
          for key, (name, kind, is_macos) in spec.items():
              path = dist / name
              if not path.is_file():
                  raise SystemExit(f"缺少打包产物: {path}")
              digest = sha256(path)
              entry = {"asset": name, "kind": kind,
                       "sha256": digest, "size": path.stat().st_size}
              if is_macos and authority:
                  entry["codesign_authority"] = authority
              assets[key] = entry

          notes = subprocess.run(
              ["git", "log", "-1", "--pretty=%s"],
              capture_output=True, text=True).stdout.strip()

          manifest = {
              "schema": 1,
              "version": version,
              "released_at": datetime.datetime.now(
                  datetime.timezone.utc).isoformat(timespec="seconds"),
              "notes": notes,
              "assets": assets,
          }
          text = json.dumps(manifest, ensure_ascii=False, indent=2) + "\n"
          (dist / "update-manifest.json").write_text(text, encoding="utf-8")
          print(text)
          PY

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

      # CDN 自动同步（123云盘开放平台）：产物先、稳定名清单最后覆盖到直链空间，
      # 含“产物与清单同批”校验、直链缓存刷新（best-effort）与回读校验（版本+产物大小）；
      # 逻辑见 scripts/sync_to_123pan.py。未配置 Secrets 时自动跳过（退回手动同步，
      # 见 docs/auto-update.md §3.1）；失败处置：重跑本 job 即可（覆盖上传幂等）。
      - name: 同步到 CDN（123云盘直链空间）
        env:
          PAN123_CLIENT_ID: ${{ secrets.PAN123_CLIENT_ID }}
          PAN123_CLIENT_SECRET: ${{ secrets.PAN123_CLIENT_SECRET }}
          # 可选：Repository variables（Settings → Secrets and variables → Variables）
          # 留空时脚本按名称搜索目录 / 使用默认直链地址
          PAN123_PARENT_FILE_ID: ${{ vars.PAN123_PARENT_FILE_ID }}
          SC_CDN_BASE_URL: ${{ vars.SC_CDN_BASE_URL }}
        run: |
          if [ -z "$PAN123_CLIENT_ID" ] || [ -z "$PAN123_CLIENT_SECRET" ]; then
            echo "::warning::未配置 PAN123_CLIENT_ID / PAN123_CLIENT_SECRET，已跳过 CDN 自动同步（可手动兜底，见 docs/auto-update.md）"
            exit 0
          fi
          python3 scripts/sync_to_123pan.py --dist dist --expect-version "${GITHUB_REF_NAME#v}"
