# 发版打包流水线：
# - 推送 v* 标签 → 三平台打包并创建 GitHub Release（附产物）
# - 手动触发（workflow_dispatch）→ 仅执行打包，产物在 Actions 运行页下载（用于验证打包）
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Windows x64 单文件（PyInstaller onefile，运行于 x64 runner，产物仅支持 64 位 Windows）
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: pip install -r agent/requirements.txt pyinstaller

      - name: 打包 Windows x64
        working-directory: agent
        run: .\build_windows.ps1

      - name: 重命名产物（标注平台与架构）
        run: Move-Item agent\dist\ScriptCueAgent.exe ScriptCueAgent-windows-x64.exe

      - uses: actions/upload-artifact@v7
        with:
          name: ScriptCueAgent-windows-x64
          path: ScriptCueAgent-windows-x64.exe

  # macOS 双架构：Apple Silicon（arm64）与 Intel（x86_64）各打一包，
  # PyInstaller 不支持跨架构构建，必须分别在对应架构 runner 上打包
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Apple Silicon
            arch: arm64
          - runner: macos-15-intel    # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: pip install -r agent/requirements.txt pyinstaller

      # 自签代码签名证书导入（可选）：未配置 Secrets 时跳过，产物保留 ad-hoc 签名。
      # 稳定签名身份使 TCC"辅助功能"授权跨版本保留（详见 agent/build_macos.sh 签名段）。
      # 需配置 Secrets：MACOS_SIGNING_P12_B64（p12 证书的 base64）、
      #   MACOS_SIGNING_PASSWORD（p12 导出密码）、MACOS_SIGNING_IDENTITY（证书名称）。
      # keychain 密码为 runner 临时钥匙串专用，仅存活于本次构建，无需保密。
      - name: 导入自签签名证书
        env:
          MACOS_SIGNING_P12_B64: ${{ secrets.MACOS_SIGNING_P12_B64 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: |
          if [ -z "$MACOS_SIGNING_P12_B64" ]; then
            echo "未配置 MACOS_SIGNING_P12_B64，跳过证书导入（产物保留 ad-hoc 签名）"
            exit 0
          fi
          python3 -c "import base64, os; open(os.environ['RUNNER_TEMP'] + '/signing.p12', 'wb').write(base64.b64decode(os.environ['MACOS_SIGNING_P12_B64']))"
          security create-keychain -p "scriptcue-runner" "$RUNNER_TEMP/build.keychain"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/build.keychain"
          security import "$RUNNER_TEMP/signing.p12" -P "$MACOS_SIGNING_PASSWORD" \
            -a -t agg -k "$RUNNER_TEMP/build.keychain" -T /usr/bin/codesign
          security list-keychain -d user -s "$RUNNER_TEMP/build.keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "scriptcue-runner" "$RUNNER_TEMP/build.keychain"

      - name: 打包 macOS ${{ matrix.arch }}（.app + 拖拽安装 .dmg）
        working-directory: agent
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: bash build_macos.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ScriptCueAgent-macos-${{ matrix.arch }}
          path: "agent/dist/ScriptCueAgent-macos-${{ matrix.arch }}.dmg"

  # 汇总创建 Release（仅 tag 触发；手动运行只产出上方 artifacts）
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: 汇集打包产物
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
