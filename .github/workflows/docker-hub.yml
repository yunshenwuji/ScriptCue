# 服务端 Docker 镜像构建并推送 Docker Hub（手动触发）：
# - 从 main 分支触发 → 推送 latest 标签
# - 从 tag（v*）触发 → 推送对应版本号标签
# 前置：仓库 Secrets 中配置 DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN
name: Docker Hub

on:
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # main 触发 → latest；tag 触发 → 版本号（如 v1.0.0 → 1.0.0）
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: yunshenwuji/scriptcue-server
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
